<!DOCTYPE html>
<html>
<head>
  <title>NeuroLens Camera Permission</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; background: #f8fafc; }
    .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
    h1 { color: #0f172a; }
    p { color: #475569; line-height: 1.5; }
    button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 20px; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Camera Access Required</h1>
    <p>NeuroLens uses MediaPipe Face Mesh to track your eye movements locally on your device. To enable this, please grant camera access. Your video never leaves your computer.</p>
    <button id="grantBtn">Grant Camera Permission</button>
    <p id="status" style="color: #059669; font-weight: bold; margin-top: 20px; display: none;">Permission Granted! You can close this tab.</p>
  </div>
  <script src="permissions.js"></script>
</body>
</html>
