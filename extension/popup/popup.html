<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroLens Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 250px;
      padding: 16px;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
    }
    h1 { font-size: 1.25rem; margin-top: 0; color: #0f172a; }
    .hidden { display: none !important; }
    
    /* Login Screen */
    #loginScreen input, #loginScreen select {
      width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;
    }
    #loginBtn { background-color: #4f46e5; }
    #loginBtn:hover { background-color: #4338ca; }
    #loginError { color: #ef4444; font-size: 0.8rem; margin-bottom: 8px; text-align: center; }
    
    /* Main Screen */
    .status {
      padding: 8px; background-color: #dcfce7; color: #166534; border-radius: 4px; font-weight: 500; text-align: center; margin-bottom: 16px;
    }
    .student-info { text-align: center; margin-bottom: 16px; font-weight: bold; }
    button {
      width: 100%; padding: 8px 16px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 8px;
    }
    #requestCamera { background-color: #059669; }
    #requestCamera:hover { background-color: #047857; }
    #logoutBtn { background-color: #ef4444; }
    #logoutBtn:hover { background-color: #dc2626; }
  </style>
</head>
<body>
  <h1>NeuroLens v2</h1>
  
  <div id="loginScreen">
    <p style="font-size: 0.875rem;">Login to start monitoring.</p>
    <div id="loginError" class="hidden"></div>
    <input type="hidden" id="schoolCode" value="BPS-1234">
    <input type="text" id="studentId" placeholder="Student ID">
    <input type="password" id="pin" placeholder="4-Digit PIN">
    
    <label style="font-size: 0.8rem; display:block; margin-bottom:4px;">Disorder Profile (First Login):</label>
    <select id="disorderProfile">
      <option value="none">None / Not Sure</option>
      <option value="dyslexia">Dyslexia</option>
      <option value="adhd">ADHD</option>
      <option value="anxiety">Anxiety</option>
    </select>
    
    <button id="loginBtn">Login</button>
  </div>

  <div id="mainScreen" class="hidden">
    <div class="student-info" id="studentNameDisplay"></div>
    <div class="status" id="statusBox">● Monitoring Active</div>
    
    <button id="requestCamera">Enable Eye Tracking</button>
    <button id="logoutBtn">Logout</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
